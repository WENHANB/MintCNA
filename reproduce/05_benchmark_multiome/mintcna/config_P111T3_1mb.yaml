# MintCNA on CARE P111T3 (oligodendroglioma, 10x Multiome ATAC+RNA)
#
# The DNA arm receives scATAC bin counts instead of scDNA read counts. That
# substitution is the experiment; everything after preprocessing is untouched.
# Every value that departs from the MintCNA default is marked and justified.

input:
  dna_counts:     "Data/mintcna_input/P111T3_1mb/atac_counts.csv"
  bin_annotation: "Data/mintcna_input/P111T3_1mb/bin_annotation.csv"
  cell_types:     "Data/mintcna_input/P111T3_1mb/cell_types.tsv"
  rna_counts:     null
  gene_annotation: null
  genome:         "hg38"          # not hg19: CARE is aligned to GRCh38

output:
  dir:    "Result/MintCNA/P111T3_atac_1mb"
  prefix: "P111T3"

mode: "dna"                       # ATAC arm alone first; RNA added once this is sane

preprocessing:
  modality:        "atac"         # NOT default -- selects run_atac_preprocessing()
  gc_filter_min:   0.2            # default; inert at 500 kb (observed range .337-.594)
  gc_filter_max:   0.8            # default
  mappability_min: 0.5            # NOT default. 0.9 is a 5 kb threshold; the 500 kb
                                  #   average is 0.886 genome-wide, so 0.9 sits inside
                                  #   the bulk of the distribution and drops 62% of bins.
                                  #   0.5 is AtaCNV's published ATAC criterion.
  blacklist_max:   0.9            # ATAC-only, and deliberately loose: blacklisted
                                  #   fragments are masked when the counts are built, and
                                  #   tumour and reference lose the same positions, so
                                  #   this only drops windows with too little left.
  valid_min:       0.5            # ATAC-only. Fraction of the window carrying GC/mapp;
                                  #   215 bins on centromeres/assembly gaps fail it.
  max_zero_frac:   0.85           # ATAC-only. epiAneufinder's sparse-bin default.
  gc_correction:   false          # recorded, not omitted. Measured cost of turning it on:
                                  #   cell-wise LOESS 0.173 -> 0.149, pooled LOESS -> 0.143,
                                  #   stratified median scaling -> 0.146. See
                                  #   Code/prep/test_gc_correction.R
  pseudocount:     1              # ATAC-only. Poisson pseudocount in COUNT space. The DNA
                                  #   eps=0.01 lives in CPM space, where a zero bin gives
                                  #   log2 = -14. Measured: a=1 > 0.5 > 0.1.
  keep_normal:     false          # reference nuclei leave the L2R output, as in DNA
  smooth:          false          # NOT default. modSaRa2::smooth is outlier clipping; in
                                  #   ATAC the upper tail is real accessibility, and
                                  #   AG-DCAE is the denoiser.

denoise:
  enabled: true
  kernel_size: 5
  stride: 1
  batch_size: 16
  learning_rate: 0.0001
  latent_dim: 250
  sigma: 0.08
  cbam_reduction: 4
  alpha: 0.1
  edge_lambda: 0.2
  patience: 15
  min_delta: 0.001
  device: "cpu"
  epochs: 100
  test_size: 0.2
  random_state: 30

segmentation:
  h: 5                            # 5 bins x 500 kb = 5 Mb scan window. CRC used 100 kb
                                  #   x h=15 = 3 Mb; the simulation 100 kb x h=5 = 1 Mb.
                                  #   Wider is deliberate: the accessibility residual is
                                  #   high-frequency and the CNA signal here is whole-arm.
  penalty: "l2"
  alpha: 0.30
  lambda: null
  ridge_lambda: null

fusion:
  method: "coverage_proportional"
  em_iterations: 30

calling:
  n_states: 5
  max_iter: 500
  convergence_tol: 0.001

clustering:
  enabled: true
  method: "kmeans"
  n_clusters: null

visualization:
  heatmap: true
